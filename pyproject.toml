[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skylark_signal"
version = "1.0.0"
description = "Founder-Facing Business Intelligence Agent for monday.com Deals and Work Orders boards"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "openpyxl>=3.1.2",
    "pandas>=2.0.0",
    "openai>=1.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
